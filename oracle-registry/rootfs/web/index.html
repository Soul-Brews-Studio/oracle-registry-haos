<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark light" />
<title>Oracle Registry</title>
<!-- Vendored, not CDN: an HA box on a LAN without internet must still render
     this page. React 18 UMD (19 dropped UMD), htm for JSX-without-a-build,
     Tailwind v4 browser build for styling at runtime. -->
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./vendor/htm.js"></script>
<script src="./vendor/tailwind.js"></script>
<style type="text/tailwindcss">
  @theme {
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  body { @apply bg-slate-100 text-slate-900 dark:bg-[#0f1115] dark:text-slate-200 m-0 font-sans text-[15px]; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const { useState, useEffect, useRef, useCallback } = React;
const html = htm.bind(React.createElement);

// Relative fetches so the same page works under the ingress path and directly.
const api = (p, o) => fetch('.' + p, o).then(async r => {
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.message || body.error || r.status);
  return body;
});

const ago = (iso) => {
  if (!iso) return '—';
  const s = Math.floor((Date.now() - Date.parse(iso)) / 1000);
  if (!Number.isFinite(s)) return '—';
  if (s < 60) return s + 's ago';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return Math.floor(s / 86400) + 'd ago';
};

const PILL = {
  online:  'text-green-500 bg-green-500/10 border-green-500/30',
  offline: 'text-red-500 bg-red-500/10 border-red-500/30',
  stale:   'text-yellow-500 bg-yellow-500/10 border-yellow-500/30',
  unknown: 'text-slate-400 bg-slate-400/10 border-slate-400/30',
};
const Pill = ({ kind, label }) => html`
  <span class="inline-flex items-center gap-1.5 text-xs font-semibold px-2.5 py-0.5 rounded-full border ${PILL[kind]}">
    <span class="w-1.5 h-1.5 rounded-full bg-current"></span>${label}
  </span>`;

const Stat = ({ n, label }) => html`
  <div class="bg-white dark:bg-[#161922] border border-slate-200 dark:border-[#242936] rounded-xl px-3.5 py-2">
    <b class="text-lg tabular-nums">${n ?? '–'}</b>
    <span class="block text-xs text-slate-500 dark:text-slate-400">${label}</span>
  </div>`;

const btn = 'text-[13px] bg-white dark:bg-[#161922] border border-slate-200 dark:border-[#242936] rounded-lg px-3 py-1.5 cursor-pointer hover:border-sky-400 transition-colors';
const inp = 'text-[13px] bg-white dark:bg-[#161922] border border-slate-200 dark:border-[#242936] rounded-lg px-2.5 py-1.5 outline-none focus:border-sky-400';

function Compose({ name, onClose }) {
  const [room, setRoom] = useState('main');
  const [text, setText] = useState('');
  const [log, setLog] = useState([]);
  const latest = useRef(0);
  const poll = useRef(null);

  useEffect(() => () => clearInterval(poll.current), []);

  const send = async (ev) => {
    ev.preventDefault();
    const msg = text.trim();
    if (!msg) return;
    try {
      // Snapshot the ring position BEFORE sending, so the poll shows only
      // replies that arrive after this message.
      try { latest.current = (await api(`/api/oracles/${encodeURIComponent(name)}/replies?since=999999999`)).latest; } catch {}
      await api(`/api/oracles/${encodeURIComponent(name)}/send`, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ room: room.trim() || 'main', text: msg }),
      });
      setText('');
      setLog(l => [...l, { dir: '→', text: msg }]);
      clearInterval(poll.current);
      let ticks = 0;
      poll.current = setInterval(async () => {
        if (++ticks > 30) { clearInterval(poll.current); return; }
        try {
          const r = await api(`/api/oracles/${encodeURIComponent(name)}/replies?since=${latest.current}`);
          latest.current = r.latest;
          r.replies.forEach(x => {
            const t = x.msg && typeof x.msg === 'object' && 'text' in x.msg ? x.msg.text : JSON.stringify(x.msg);
            setLog(l => [...l, { dir: '←', room: x.room, text: t }]);
          });
        } catch {}
      }, 2000);
    } catch (e) {
      setLog(l => [...l, { dir: '✗', text: e.message }]);
    }
  };

  return html`
    <tr><td colSpan="8" class="bg-slate-50 dark:bg-[#0f1115] px-3.5 py-3 border-b border-slate-200 dark:border-[#242936]">
      <form class="flex gap-2 items-center flex-wrap" onSubmit=${send}>
        <input class="${inp} w-24" value=${room} onInput=${e => setRoom(e.target.value)} title="room" />
        <input class="${inp} flex-1 min-w-[220px]" placeholder="Message to ${name}…" autoFocus
               value=${text} onInput=${e => setText(e.target.value)} />
        <button class=${btn} type="submit">Send</button>
        <button class=${btn} type="button" onClick=${onClose}>Close</button>
      </form>
      ${log.length > 0 && html`
        <div class="mt-2">
          ${log.map((x, i) => html`
            <div key=${i} class="font-mono text-[12.5px] py-1 border-t border-dashed border-slate-200 dark:border-[#242936] whitespace-pre-wrap break-words">
              ${x.dir} ${x.room ? `[${x.room}] ` : ''}${x.text}
            </div>`)}
        </div>`}
    </td></tr>`;
}

const th = 'text-[11px] uppercase tracking-wider text-slate-500 dark:text-slate-400 font-semibold text-left px-3.5 py-2.5 border-b border-slate-200 dark:border-[#242936]';
const td = 'px-3.5 py-2.5 border-b border-slate-200 dark:border-[#242936]';
const dim = 'text-[13px] text-slate-500 dark:text-slate-400';

function Table({ data, dispatchOn, composeFor, setComposeFor }) {
  if (!data) return null;
  if (!data.count) return html`
    <div class="py-11 px-6 text-center text-slate-500 dark:text-slate-400">
      <p>No oracle has announced itself yet.</p>
      <p class="mt-2">An oracle registers by connecting with a retained will and publishing <code class="font-mono text-[12.5px]">online</code>:</p>
      <p class="mt-2"><code class="font-mono text-[12.5px] bg-white dark:bg-[#161922] border border-slate-200 dark:border-[#242936] px-1.5 py-0.5 rounded">
        mosquitto_pub -t 'oracle/‹name›/lwt' -m online -r -q 1 --will-topic 'oracle/‹name›/lwt' --will-payload offline --will-retain</code></p>
    </div>`;

  return html`
    <table class="w-full border-collapse bg-white dark:bg-[#161922] border border-slate-200 dark:border-[#242936] rounded-xl overflow-hidden">
      <thead><tr>
        <th class=${th}>Oracle</th><th class=${th}>State</th><th class=${th}>Channel</th><th class=${th}>Host</th>
        <th class=${th}>Last seen</th><th class=${th}>Online since</th><th class=${th}>Transitions</th><th class=${th}></th>
      </tr></thead>
      <tbody>
        ${data.oracles.map(o => html`
          <${React.Fragment} key=${o.name}>
            <tr>
              <td class="${td} font-mono font-semibold">${o.name}</td>
              <td class=${td}><${Pill} kind=${o.stale ? 'stale' : (PILL[o.state] ? o.state : 'unknown')} label=${o.stale ? 'stale' : o.state} /></td>
              <td class=${td}>${o.channel === true ? html`<${Pill} kind="online" label="channel" />`
                             : o.channel === false ? html`<${Pill} kind="offline" label="channel down" />`
                             : html`<span class=${dim}>—</span>`}</td>
              <td class="${td} font-mono text-[12.5px]">${o.host || '—'}</td>
              <td class="${td} ${dim}">${ago(o.lastSeen)}</td>
              <td class="${td} ${dim}">${o.state === 'online' ? ago(o.lastOnline) : '—'}</td>
              <td class="${td} ${dim}">${o.transitions}</td>
              <td class=${td}>${o.channel === true && dispatchOn && html`
                <button class=${btn} onClick=${() => setComposeFor(o.name)}>Send</button>`}</td>
            </tr>
            ${composeFor === o.name && html`<${Compose} name=${o.name} onClose=${() => setComposeFor(null)} />`}
          <//>`)}
      </tbody>
    </table>`;
}

function Keys() {
  const [keys, setKeys] = useState([]);
  const [minted, setMinted] = useState(null);
  const load = useCallback(() => api('/api/keys').then(d => setKeys(d.keys)).catch(() => {}), []);
  useEffect(() => { load(); }, [load]);

  const mint = async () => {
    const label = prompt('What is this key for?', 'fleet dashboard');
    if (label === null) return;
    const can = confirm('Allow this key to DISPATCH messages to oracles?\n\nOK = can send (treat like a write credential)\nCancel = read-only');
    const k = await api('/api/keys', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ label, can_dispatch: can }),
    });
    setMinted(k.key);
    load();
  };
  const revoke = async (id) => { await api('/api/keys/' + id, { method: 'DELETE' }); load(); };

  return html`
    <details class="mt-5">
      <summary class="cursor-pointer text-[13px] text-slate-500 dark:text-slate-400">API keys — for reading this registry from outside Home Assistant</summary>
      <p class="${dim} mt-2">The sidebar is authenticated by Home Assistant, so it needs no key. A key is for anything else:
        <code class="font-mono text-[12.5px]">Authorization: Bearer ‹key›</code>. Keys can only be minted here, never by another key.
        A dispatch-capable key can send messages into oracle sessions — treat it like a write credential.</p>
      <button class="${btn} mt-2" onClick=${mint}>Mint a key</button>
      ${minted && html`
        <div class="font-mono text-xs break-all bg-slate-100 dark:bg-[#0f1115] border border-slate-200 dark:border-[#242936] rounded-lg p-2.5 my-2">${minted}</div>
        <p class=${dim}>Copy it now — it is not shown again.</p>`}
      ${keys.length > 0 && html`
        <table class="w-full border-collapse bg-white dark:bg-[#161922] border border-slate-200 dark:border-[#242936] rounded-xl overflow-hidden mt-2">
          <thead><tr><th class=${th}>Label</th><th class=${th}>Dispatch</th><th class=${th}>Created</th><th class=${th}>Last used</th><th class=${th}></th></tr></thead>
          <tbody>${keys.map(k => html`
            <tr key=${k.id}>
              <td class=${td}>${k.label}</td>
              <td class=${td}>${k.can_dispatch ? html`<${Pill} kind="stale" label="can send" />` : html`<span class=${dim}>read-only</span>`}</td>
              <td class="${td} ${dim}">${k.created_at.slice(0, 10)}</td>
              <td class="${td} ${dim}">${k.last_used ? ago(k.last_used) : 'never'}</td>
              <td class=${td}><button class=${btn} onClick=${() => revoke(k.id)}>Revoke</button></td>
            </tr>`)}</tbody>
        </table>`}
    </details>`;
}

function App() {
  const [health, setHealth] = useState(null);
  const [data, setData] = useState(null);
  const [err, setErr] = useState(null);
  const [updated, setUpdated] = useState('');
  const [composeFor, setComposeFor] = useState(null);
  const composeRef = useRef(null);
  composeRef.current = composeFor;

  const load = useCallback(async () => {
    try {
      const h = await api('/api/health');
      const d = await api('/api/oracles');
      setHealth(h); setData(d); setErr(null);
      setUpdated('updated ' + new Date().toLocaleTimeString());
    } catch (e) { setErr(e.message); }
  }, []);

  useEffect(() => {
    load();
    // The repaint is skipped while a compose row is open — a redraw
    // mid-typing would reset the form.
    const t = setInterval(() => { if (!composeRef.current) load(); }, 10000);
    return () => clearInterval(t);
  }, [load]);

  const dispatchOn = !!(health && health.dispatch && health.dispatch.enabled && health.dispatch.connected);

  return html`
    <div>
      <header class="pt-5 px-6">
        <h1 class="text-[19px] font-semibold tracking-tight m-0">Oracle Registry</h1>
        <div class="text-[13px] text-slate-500 dark:text-slate-400">
          Liveness from MQTT's Last Will and Testament — the broker reports a death nobody was alive to report.
        </div>
      </header>

      ${health && !(health.mqtt && health.mqtt.connected) && html`
        <div class="bg-red-500/10 border border-red-500/35 rounded-lg px-3.5 py-2.5 mx-6 mt-3.5 text-[13px]">
          <b>Not connected to the broker.</b> ${(health.mqtt && health.mqtt.error) || 'connecting…'} — the list below is the last known state, not live.
        </div>`}

      <div class="flex gap-2.5 flex-wrap items-center px-6 py-4">
        <${Stat} n=${data && data.online} label="online" />
        <${Stat} n=${data && data.stale} label="stale" />
        <${Stat} n=${data && data.offline} label="offline" />
        <${Stat} n=${data && data.count} label="known" />
        <button class=${btn} onClick=${load}>Refresh</button>
        <span class=${dim}>${updated}</span>
        ${health && health.dispatch && health.dispatch.enabled && !health.dispatch.connected && html`
          <span class="text-[12px] text-yellow-500">dispatch configured but disconnected</span>`}
      </div>

      <main class="px-6 pb-8">
        ${err ? html`<div class="py-11 text-center text-slate-500">Could not load: ${err}</div>`
              : html`<${Table} data=${data} dispatchOn=${dispatchOn} composeFor=${composeFor} setComposeFor=${setComposeFor} />`}
        <${Keys} />
      </main>
    </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
